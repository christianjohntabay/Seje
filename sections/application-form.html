<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Application Form</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/style.css">

<style>

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;
}

.page-container{
width:100%;
max-width:1100px;
}

.page-card{
padding:60px;
border-radius:35px;
}

.page-title{
font-size:52px;
font-weight:800;
margin-bottom:35px;
line-height:1.1;
text-transform:uppercase;
}

.form-image{
width:100%;
border-radius:25px;
overflow:hidden;
border:2px solid rgba(255,255,255,0.08);
box-shadow:0 15px 35px rgba(0,0,0,0.25);
margin-bottom:35px;
}

.form-image img{
width:100%;
display:block;
object-fit:cover;
}

.back-btn{
display:inline-block;
}

@media(max-width:900px){

body{
padding:20px;
align-items:flex-start;
}

.page-card{
padding:30px 20px;
border-radius:28px;
}

.page-title{
font-size:34px;
margin-bottom:25px;
}

.back-btn{
width:100%;
text-align:center;
padding:15px;
font-size:15px;
}

}

</style>

</head>

<body>

<div class="page-container">

<div class="glass page-card">

<h1 class="page-title">
APPLICATION FORM
</h1>

<div class="form-image">
<img src="../images/Picture1.png" alt="Application Form">
</div>

<div class="form-image">
<img src="../images/picture2.png" alt="Application Form">
</div>

<a href="../index.html" class="primary-btn back-btn">
Back Home
</a>

</div>

</div>

</body>

</html>
