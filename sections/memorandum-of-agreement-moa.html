<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memorandum Of Agreement</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/style.css">

<style>

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 20px;
}

.page-container{
width:100%;
max-width:1200px;
}

.page-card{
padding:60px;
border-radius:35px;
}

.page-title{
font-size:52px;
font-weight:800;
margin-bottom:35px;
line-height:1.1;
}

/* TOP 2 IMAGES */
.image-row{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px;
margin-bottom:25px;
}

/* SINGLE BOTTOM IMAGE */
.bottom-image{
display:flex;
justify-content:center;
margin-bottom:35px;
}

.medical-image{
width:100%;
display:flex;
align-items:center;
justify-content:center;
}

.medical-image img{
width:100%;
max-width:500px;
height:auto;
object-fit:contain;
border-radius:25px;
border:2px solid rgba(255,255,255,0.08);
box-shadow:0 15px 35px rgba(0,0,0,0.25);
background:rgba(255,255,255,0.03);
padding:15px;
display:block;
}

.bottom-image img{
max-width:550px;
}

.back-btn{
display:inline-block;
}

@media(max-width:900px){

body{
padding:20px;
align-items:flex-start;
}

.page-card{
padding:30px 25px;
border-radius:28px;
}

.page-title{
font-size:34px;
margin-bottom:25px;
}

/* STACK ALL IMAGES ON MOBILE */
.image-row{
grid-template-columns:1fr;
gap:20px;
}

.medical-image img{
max-width:100%;
padding:10px;
border-radius:20px;
}

.back-btn{
width:100%;
text-align:center;
padding:15px;
font-size:15px;
}

}

</style>

</head>

<body>

<div class="page-container">

<div class="glass page-card">

<h1 class="page-title">
Memorandum Of Agreement
</h1>

<!-- TOP 2 SIDE BY SIDE -->
<div class="image-row">

<div class="medical-image">
<img src="../images/moa1.jpg" alt="MOA 1">
</div>

<div class="medical-image">
<img src="../images/moa2.jpg" alt="MOA 2">
</div>

</div>

<!-- BOTTOM CENTER IMAGE -->
<div class="bottom-image">

<div class="medical-image">
<img src="../images/moa3.jpg" alt="MOA 3">
</div>

</div>

<a href="../index.html" class="primary-btn back-btn">
Back Home
</a>

</div>

</div>

</body>

</html>
